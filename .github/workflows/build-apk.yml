name: Bygg APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew :tool:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nrk-radio-apk
          path: tool/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          files: tool/build/outputs/apk/debug/*.apk
